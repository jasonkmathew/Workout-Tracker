<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Split | Premium Workout Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Auth Section -->
    <div id="authContainer" class="auth-container">
        <div class="auth-header">
            <h1>SPLIT</h1>
            <p style="color: var(--text-secondary); margin-bottom: 32px;">Track your progress, visualize your gains.</p>
        </div>

        <div class="card">
            <button class="btn btn-google" onclick="handleGoogleAuth()">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4"
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                    <path fill="#34A853"
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05"
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                    <path fill="#EA4335"
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                </svg>
                Continue with Google
            </button>

            <div style="display: flex; align-items: center; margin: 20px 0; color: var(--text-secondary);">
                <div style="flex: 1; height: 1px; background: var(--glass-border);"></div>
                <span style="padding: 0 10px; font-size: 0.9rem;">OR</span>
                <div style="flex: 1; height: 1px; background: var(--glass-border);"></div>
            </div>

            <input type="email" id="email" placeholder="Email address">
            <input type="password" id="password" placeholder="Password">

            <button class="btn btn-primary" onclick="handleEmailAuth(false)" style="margin-bottom: 12px;">Sign
                In</button>
            <button class="btn btn-secondary" onclick="handleEmailAuth(true)">Create Account</button>
        </div>
    </div>

    <!-- Loading Screen -->
    <div id="loadingScreen" class="hidden">
        <div class="loading-spinner"></div>
        <p style="text-align: center; color: var(--text-secondary);">Syncing your gains...</p>
    </div>

    <!-- Main App -->
    <div id="appContainer" class="container hidden">
        <header class="app-header">
            <div class="user-profile">
                <div class="avatar" id="avatar">U</div>
                <div>
                    <div style="font-size: 0.85rem; color: var(--text-secondary);">Welcome back</div>
                    <div id="userInfo" style="font-weight: 600;">User</div>
                </div>
            </div>
            <button class="btn btn-secondary" onclick="handleLogout()"
                style="width: auto; padding: 8px 16px; font-size: 0.85rem;">Logout</button>
        </header>

        <!-- Analytics Card -->
        <div class="card">
            <h3
                style="margin-bottom: 16px; font-size: 1rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em;">
                Progress Analytics</h3>
            <canvas id="progressChart" height="200"></canvas>
        </div>

        <!-- Controls -->
        <div class="controls-grid">
            <div>
                <label
                    style="display: block; margin-bottom: 8px; font-size: 0.85rem; color: var(--text-secondary);">Week</label>
                <select id="weekSelect">
                    <option value="1">Week 1</option>
                    <option value="2">Week 2</option>
                    <option value="3">Week 3</option>
                    <option value="4">Week 4</option>
                    <option value="5">Week 5</option>
                    <option value="6">Week 6</option>
                    <option value="7">Week 7</option>
                    <option value="8">Week 8</option>
                    <option value="9">Week 9</option>
                    <option value="10">Week 10</option>
                    <option value="11">Week 11</option>
                    <option value="12">Week 12</option>
                </select>
            </div>
            <div>
                <label
                    style="display: block; margin-bottom: 8px; font-size: 0.85rem; color: var(--text-secondary);">Workout</label>
                <select id="workoutSelect">
                    <option value="upperA">Upper A</option>
                    <option value="lowerA">Lower A</option>
                    <option value="rest1">Rest Day</option>
                    <option value="upperB">Upper B</option>
                    <option value="lowerB">Lower B</option>
                    <option value="rest2">Rest Day</option>
                </select>
            </div>
        </div>

        <!-- Workout Content -->
        <div id="workoutContent">
            <!-- Dynamically populated -->
        </div>
    </div>

    <div id="saveIndicator" class="save-toast">
        Saved ✓
    </div>

    <script type="module" src="app.js"></script>
</body>

</html>
